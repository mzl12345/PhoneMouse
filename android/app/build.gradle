plugins {
    id 'com.android.application'
}

// 签名配置从本地 keystore.properties 读（该文件不入库，见 keystore.properties.example）
// 之前密码是硬编码在这里的 —— 一旦仓库公开，别人就能签出同一个身份的 APK。
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.mzl.phonemouse'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mzl.phonemouse'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            if (!keystoreFile.exists()) {
                throw new GradleException(
                        "缺少 android/keystore.properties。\n" +
                        "复制 keystore.properties.example 为 keystore.properties 并填好签名信息。")
            }
            storeFile file(keystoreProps.getProperty('storeFile'))
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
